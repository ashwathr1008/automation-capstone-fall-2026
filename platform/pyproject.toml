[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lanm-platform"
version = "0.1.0"
description = "A local scientific workspace for lanmodulin evidence and conditional process economics"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
slides = ["python-pptx>=1", "reportlab>=4", "PyMuPDF>=1.24"]

[project.scripts]
lanm-platform = "lanm_platform.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lanm_platform = ["data/*.gz", "data/*.md", "data/*.zip"]

[tool.setuptools.data-files]
"share/lanm-platform/ui" = ["ui/index.html", "ui/app.js", "ui/styles.css"]
